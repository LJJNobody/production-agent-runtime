services:
  agent-runtime:
    build:
      context: .
      target: runtime
    image: production-agent-runtime:local
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AGENT_CONFIG: /app/config/production.json
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-agent-model}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
